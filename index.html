<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clean Food Challenge</title>
    <script>document.documentElement.classList.add('dark');</script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config = { darkMode: 'class' };</script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Space+Grotesk:wght@500;600&amp;display=swap');

        html, body {
            height: 100%;
            margin: 0;
        }

        body {
            font-family: 'Inter', system-ui, sans-serif;
            background: #f1f5f9;
            color: #1e293b;
            transition: background-color 0.2s, color 0.2s;
        }

        .dark body {
            background: #0f172a;
            color: #e2e8f0;
        }

        .ui-card {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
        }

        .dark .ui-card {
            background: #1e293b;
            border-color: #334155;
            box-shadow: none;
        }

        .ui-panel {
            background: rgba(248, 250, 252, 0.85);
            border: 1px solid #e2e8f0;
        }

        .dark .ui-panel {
            background: rgba(30, 41, 59, 0.75);
            border-color: #334155;
        }

        .ui-input {
            background: #ffffff;
            border-color: #cbd5e1;
            color: #1e293b;
        }

        .dark .ui-input {
            background: #0f172a;
            border-color: #475569;
            color: #f1f5f9;
        }

        .ui-modal {
            background: #ffffff;
            color: #1e293b;
        }

        .dark .ui-modal {
            background: #1e293b;
            color: #f1f5f9;
        }

        .dark .section-header { color: #94a3b8; }
        .dark .settings-section-title { color: #94a3b8; }

        .content-wrapper {
            flex: 1;
        }

        .font-display {
            font-family: 'Space Grotesk', 'Inter', sans-serif;
            font-weight: 600;
        }

        .section-header {
            font-size: 0.7rem;
            font-weight: 700;
            letter-spacing: 0.06em;
            color: #64748b;
        }

        .accent-gold {
            color: #8a8200;
        }

        .dark .accent-gold {
            color: #f5e88a;
        }

        .meal-row {
            border: 1px solid #f1f5f9;
        }

        .dark .meal-row {
            border-color: #334155;
        }

        .protein-ampel-ok { color: #047857; }
        .dark .protein-ampel-ok { color: #6ee7b7; }
        .protein-ampel-warn { color: #8a8200; }
        .dark .protein-ampel-warn { color: #f5e88a; }
        .protein-ampel-low { color: #dc2626; }
        .dark .protein-ampel-low { color: #f87171; }

        .app-container {
            width: 100%;
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
        }

        .meal-card {
            cursor: grab;
            user-select: none;
        }

        .meal-card:active {
            cursor: grabbing;
        }

        .meal-drop-active {
            background: #eff6ff !important;
            border-color: #93c5fd !important;
        }

        .dark .meal-drop-active {
            background: #1e3a5f !important;
            border-color: #3b82f6 !important;
        }

        .settings-panel {
            width: 100%;
            height: 100dvh;
        }

        .settings-section-title {
            font-size: 0.8rem;
            font-weight: 700;
            letter-spacing: 0.06em;
            color: #64748b;
        }

        details > summary::-webkit-details-marker {
            display: none;
        }
    </style>
</head>
<body>
    <div class="app-container">

        <!-- Header -->
        <div class="bg-gradient-to-r from-blue-800 via-blue-700 to-blue-600 text-white px-4 sm:px-6 py-3">
            <div class="flex flex-wrap items-center gap-x-4 gap-y-3">
                <div class="flex items-center gap-3 min-w-0 shrink-0">
                    <div class="w-10 h-10 bg-white/20 backdrop-blur-md rounded-2xl flex items-center justify-center shrink-0">
                        <i class="fa-solid fa-utensils text-xl"></i>
                    </div>
                    <div class="min-w-0">
                        <div id="current-day-name" class="font-display text-xl sm:text-2xl tracking-tight leading-tight"></div>
                        <div id="current-day-date" class="text-sm text-white/70 font-medium"></div>
                    </div>
                </div>

                <div class="flex items-center gap-2 ml-auto shrink-0">
                    <button onclick="showSettings()" class="px-3 py-2 bg-white/15 hover:bg-white/25 rounded-2xl text-sm font-medium flex items-center gap-x-2" title="Einstellungen">
                        <i class="fa-solid fa-cog"></i>
                        <span class="hidden sm:inline">Einstellungen</span>
                    </button>
                </div>
            </div>
        </div>

        <div class="content-wrapper px-4 sm:px-6 pt-4 pb-6 space-y-4 w-full">
            <div class="ui-card rounded-3xl p-4 min-w-0">
                <div class="section-header mb-3 px-1 text-teal-700 dark:text-teal-400 flex items-center gap-x-2">
                    <i class="fa-solid fa-utensils"></i>
                    <span>ESSEN</span>
                </div>
                <div id="meals-today" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3 text-sm"></div>
            </div>
        </div>
    </div>

    <!-- Settings Modal -->
    <div id="settings-modal" class="hidden fixed inset-0 z-[100] bg-white dark:bg-slate-900">
        <div class="settings-panel flex flex-col overflow-hidden">
            <div class="shrink-0 px-5 sm:px-7 py-4 border-b border-slate-100 dark:border-slate-700 flex justify-between items-center bg-white dark:bg-slate-900">
                <div class="font-bold text-2xl text-slate-800 dark:text-slate-100">Einstellungen</div>
                <button onclick="hideSettings()" class="text-3xl text-slate-300 dark:text-slate-500 hover:text-slate-500 dark:hover:text-slate-300 leading-none">&times;</button>
            </div>

            <div class="flex-1 overflow-y-auto px-5 sm:px-7 py-5 space-y-5">
                <div class="ui-panel rounded-3xl p-5 sm:p-6 space-y-4">
                    <div class="settings-section-title text-teal-700 dark:text-teal-400">MENÜ ZUSAMMENSTELLEN</div>

                    <div class="max-w-sm">
                        <label class="text-sm text-slate-600 dark:text-slate-400 block mb-1.5 font-medium">Tagesbasis (kcal)</label>
                        <input type="number" id="settings-daily-budget" min="800" max="5000" step="50"
                               oninput="renderMenuBuilder()"
                               class="ui-input w-full border rounded-2xl px-3 py-2.5 text-base">
                        <p class="text-xs text-slate-400 dark:text-slate-500 mt-1.5">Gilt jeden Tag fürs Menü. Extras nach Training auf der Garmin-Uhr ablesen.</p>
                    </div>

                    <div class="grid grid-cols-1 lg:grid-cols-[minmax(220px,280px)_1fr] gap-4 lg:gap-5 items-start">
                        <div class="flex flex-col min-h-0">
                            <div class="text-sm text-slate-600 dark:text-slate-400 mb-2 font-medium shrink-0">
                                Zutaten
                                <span class="text-slate-400 dark:text-slate-500 font-normal block text-xs mt-0.5">Ziehen oder klicken · aktiv: <span id="active-meal-label" class="font-semibold text-teal-600 dark:text-teal-400">Frühstück</span></span>
                            </div>
                            <div id="ingredient-pool" class="ui-card flex flex-col gap-2 p-2 rounded-2xl overflow-y-auto lg:max-h-[calc(100dvh-15rem)]"></div>
                        </div>
                        <div class="flex flex-col min-h-0">
                            <div class="shrink-0 mb-2">
                                <div class="flex justify-between items-start gap-3">
                                    <div class="text-sm text-slate-600 dark:text-slate-400 font-medium">Mahlzeiten</div>
                                    <div class="text-right">
                                        <div id="menu-remaining-kcal" class="text-sm font-bold text-teal-700 dark:text-teal-400"></div>
                                        <div id="menu-protein-ampel" class="text-xs font-semibold mt-0.5"></div>
                                    </div>
                                </div>
                            </div>
                            <div id="meal-slots-container" class="grid grid-cols-1 md:grid-cols-2 gap-3 text-base"></div>
                        </div>
                    </div>
                </div>

                <details class="ui-panel rounded-3xl group">
                    <summary class="px-5 py-4 cursor-pointer list-none flex items-center justify-between font-semibold text-slate-600 dark:text-slate-400 hover:text-slate-800 dark:hover:text-slate-200">
                        <span class="settings-section-title">ZUTATEN BEARBEITEN</span>
                        <i class="fa-solid fa-chevron-down text-slate-400 group-open:rotate-180 transition-transform"></i>
                    </summary>
                    <div class="px-5 pb-5 pt-1 border-t border-slate-100 dark:border-slate-700">
                        <div class="hidden sm:grid grid-cols-[1fr_5.5rem_4.5rem_2rem] gap-3 text-xs font-bold uppercase tracking-wide text-slate-400 px-3 mb-2">
                            <span>Zutat</span>
                            <span class="text-right">kcal</span>
                            <span class="text-right">Protein</span>
                            <span></span>
                        </div>
                        <div id="ingredient-editor-list" class="space-y-2.5 max-h-[40vh] overflow-y-auto"></div>
                        <button type="button" onclick="addIngredientInSettings()"
                                class="mt-4 w-full py-3 border border-dashed border-slate-300 dark:border-slate-600 rounded-2xl text-sm font-semibold text-slate-600 dark:text-slate-400 hover:bg-white dark:hover:bg-slate-800">
                            + Zutat hinzufügen
                        </button>
                    </div>
                </details>

                <div class="ui-panel rounded-3xl p-5">
                    <div class="settings-section-title mb-3">BACKUP</div>
                    <div class="flex flex-col sm:flex-row gap-3">
                        <button type="button" onclick="exportData()"
                                class="flex-1 py-3 bg-teal-700 text-white rounded-2xl text-sm font-bold flex items-center justify-center gap-2">
                            <i class="fa-solid fa-download"></i> Exportieren
                        </button>
                        <button type="button" onclick="document.getElementById('import-file-input').click()"
                                class="flex-1 py-3 border border-slate-300 dark:border-slate-600 rounded-2xl text-sm font-bold flex items-center justify-center gap-2">
                            <i class="fa-solid fa-upload"></i> Importieren
                        </button>
                        <input type="file" id="import-file-input" accept=".json,application/json" class="hidden" onchange="importDataFromFile(event)">
                    </div>
                    <p class="text-xs text-slate-400 dark:text-slate-500 mt-2">Sichert Menü und Einstellungen als JSON-Datei.</p>
                </div>
            </div>

            <div class="shrink-0 px-5 sm:px-7 py-4 border-t border-slate-100 dark:border-slate-700 flex gap-3 bg-white dark:bg-slate-900">
                <button onclick="hideSettings()" class="flex-1 py-3.5 border border-slate-300 dark:border-slate-600 rounded-2xl font-bold text-base">Abbrechen</button>
                <button onclick="saveSettings()" class="flex-1 py-3.5 bg-teal-700 text-white rounded-2xl font-bold text-base">Speichern</button>
            </div>
        </div>
    </div>

    <script>
        const BASE_PROTEIN = 150;
        const MENU_PLANS_VERSION = 6;

        const MEAL_SLOTS = ['Frühstück', 'Znüni', 'Mittag', 'Abend'];
        const MEAL_SLOT_COLORS = [
            'border-yellow-200 bg-yellow-50/40 dark:border-yellow-800 dark:bg-yellow-950/30',
            'border-yellow-200 bg-yellow-50/30 dark:border-yellow-800 dark:bg-yellow-950/25',
            'border-teal-200 dark:border-teal-800 dark:bg-teal-950/30',
            'border-purple-200 dark:border-purple-800 dark:bg-purple-950/30'
        ];
        const MEAL_KCAL_COLOR = 'text-teal-600 dark:text-teal-400';
        const MEAL_INGREDIENT_COLOR = 'text-slate-500 dark:text-slate-400';
        const DEFAULT_DAILY_BUDGET_KCAL = 1900;

        const DEFAULT_INGREDIENTS = [
            { id: 'apfel', label: 'Apfel', kcal: 78, protein: 0 },
            { id: 'banane', label: 'Banane', kcal: 95, protein: 1 },
            { id: 'ei1', label: 'Ei', kcal: 72, protein: 6 },
            { id: 'erbsen100', label: 'Erbsen (gekocht) 100g', kcal: 81, protein: 5 },
            { id: 'feta125', label: 'Feta 125g', kcal: 329, protein: 21 },
            { id: 'haferkleie20', label: 'Haferkleie 20g', kcal: 49, protein: 3 },
            { id: 'heidel50', label: 'Heidelbeeren 50g', kcal: 29, protein: 0 },
            { id: 'kartoffeln100', label: 'Kartoffeln (roh) 100g', kcal: 77, protein: 2 },
            { id: 'karotten100', label: 'Karotten 100g', kcal: 41, protein: 1 },
            { id: 'quark125', label: 'Magerquark 125g', kcal: 89, protein: 16 },
            { id: 'quark250', label: 'Magerquark 250g', kcal: 178, protein: 33 },
            { id: 'parmesan30', label: 'Parmesan 30g', kcal: 129, protein: 11 },
            { id: 'peperoni', label: 'Peperoni', kcal: 37, protein: 1 },
            { id: 'poulet100', label: 'Poulet 100g', kcal: 165, protein: 31 },
            { id: 'reis50', label: 'Reis (gekocht) 50g', kcal: 55, protein: 1 },
            { id: 'reis100', label: 'Reis (gekocht) 100g', kcal: 110, protein: 2 },
            { id: 'rinderhack150', label: 'Rinderhack 150g', kcal: 248, protein: 32 },
            { id: 'rinderhack200', label: 'Rinderhack 200g', kcal: 330, protein: 42 },
            { id: 'rinderhack250', label: 'Rinderhack 250g', kcal: 413, protein: 53 },
            { id: 'linsen100', label: 'Rote Linsen (trocken) 100g', kcal: 352, protein: 26 },
            { id: 'skyr85', label: 'Skyr 85g', kcal: 54, protein: 9 },
            { id: 'skyr170', label: 'Skyr 170g', kcal: 107, protein: 19 },
            { id: 'skyr450', label: 'Skyr 450g', kcal: 283, protein: 50 },
            { id: 'suesskartoffel100', label: 'Süsskartoffeln (roh) 100g', kcal: 86, protein: 2 },
            { id: 'thon155', label: 'Thon 155g', kcal: 180, protein: 40 },
            { id: 'zucchini200', label: 'Zucchini 200g', kcal: 34, protein: 2 }
        ];

        const DEFAULT_MENU_PLAN = {
            'Frühstück': ['skyr450', 'haferkleie20', 'banane', 'apfel', 'heidel50'],
            'Znüni': ['banane', 'apfel', 'heidel50', 'haferkleie20'],
            'Mittag': ['rinderhack250', 'zucchini200', 'reis100', 'parmesan30', 'erbsen100'],
            'Abend': ['zucchini200', 'reis100', 'ei1', 'ei1', 'ei1', 'erbsen100']
        };

        let settings = {};
        let activeMealSlot = 'Frühstück';
        let menuBuilderDraft = null;
        let ingredientEditorDraft = null;
        let dragIngState = { id: null, sourceSlot: null, sourceIndex: null };

        function getTodayKey() {
            const d = new Date();
            return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
        }

        function formatDateDE(dateStr) {
            const [y, m, d] = dateStr.split('-');
            return `${d}.${m}.${y}`;
        }

        function loadData() {
            const saved = localStorage.getItem('ernaehrung_v3');
            if (!saved) return;
            const parsed = JSON.parse(saved);
            settings = { ...parsed.settings };
            ensureMenuData();
        }

        function saveData() {
            localStorage.setItem('ernaehrung_v3', JSON.stringify({ settings }));
        }

        function isLegacyDualMenuPlans(plans) {
            return plans && typeof plans === 'object' && (plans.arbeit || plans.frei) && plans['Frühstück'] == null;
        }

        function migrateToSingleMenuPlan(plans) {
            if (!plans) return JSON.parse(JSON.stringify(DEFAULT_MENU_PLAN));
            if (isLegacyDualMenuPlans(plans)) {
                return JSON.parse(JSON.stringify(plans.arbeit || plans.frei || DEFAULT_MENU_PLAN));
            }
            return plans;
        }

        function ensureSingleMenuPlan() {
            const source = settings.menuPlan || settings.menuPlans;
            settings.menuPlan = migrateToSingleMenuPlan(source);
            delete settings.menuPlans;
        }

        function syncMissingDefaultIngredients() {
            DEFAULT_INGREDIENTS.forEach(def => {
                if (!settings.ingredients.some(ing => ing.id === def.id)) {
                    settings.ingredients.push(JSON.parse(JSON.stringify(def)));
                }
            });
        }

        function runMenuDataMigration(fromVersion) {
            const defaultById = Object.fromEntries(DEFAULT_INGREDIENTS.map(i => [i.id, i]));
            const knownIds = new Set(DEFAULT_INGREDIENTS.map(i => i.id));

            if (fromVersion < 6) {
                settings.ingredients = settings.ingredients.filter(ing => knownIds.has(ing.id));
                DEFAULT_INGREDIENTS.forEach(def => {
                    if (!settings.ingredients.some(ing => ing.id === def.id)) {
                        settings.ingredients.push(JSON.parse(JSON.stringify(def)));
                    }
                });
                settings.ingredients.forEach(ing => {
                    const def = defaultById[ing.id];
                    if (def) {
                        ing.label = def.label;
                        ing.kcal = def.kcal;
                        ing.protein = def.protein;
                    }
                });
                remapMealSlotName(settings.menuPlan, 'Snack', 'Znüni');
                remapMenuIngredientIds(settings.menuPlan, {
                    reis75: 'reis100',
                    ei3: 'ei1',
                    feta30: 'feta125',
                    peperoni100: 'peperoni',
                    quark200: 'quark250',
                    heidel30: 'heidel50'
                });
                pruneMenuPlan(settings.menuPlan, knownIds);
            }
        }

        function ensureMenuData() {
            if (settings.ingredients?.length && (settings.menuPlan || settings.menuPlans)) {
                ensureSingleMenuPlan();
                migrateDailyBudget();
                cleanupLegacySettings();

                const version = settings.menuPlansVersion || 1;
                if (version < MENU_PLANS_VERSION) {
                    runMenuDataMigration(version);
                    settings.menuPlansVersion = MENU_PLANS_VERSION;
                }
                syncMissingDefaultIngredients();
                const validIds = new Set(settings.ingredients.map(i => i.id));
                pruneMenuPlan(settings.menuPlan, validIds);
                settings.ingredients = sortIngredients(settings.ingredients);
                return;
            }
            settings.ingredients = JSON.parse(JSON.stringify(DEFAULT_INGREDIENTS));
            settings.menuPlan = JSON.parse(JSON.stringify(DEFAULT_MENU_PLAN));
            settings.menuPlansVersion = MENU_PLANS_VERSION;
            settings.dailyBudgetKcal = DEFAULT_DAILY_BUDGET_KCAL;
            cleanupLegacySettings();
        }

        function cleanupLegacySettings() {
            delete settings.darkMode;
            delete settings.weeklyLossKg;
            delete settings.bodyWeightKg;
            delete settings.heightCm;
            delete settings.age;
            delete settings.sex;
            delete settings.dailyBudget;
            delete settings.maintenanceManual;
            delete settings.maintenanceKcal;
            delete settings.pushupButtons;
            delete settings.pullupButtons;
            delete settings.burpeeButtons;
            delete settings.demoDataActive;
            delete settings.mealPool;
            delete settings.mealPlans;
            delete settings.meals;
        }

        function sortIngredients(list) {
            return [...list].sort((a, b) => a.label.localeCompare(b.label, 'de', { numeric: true, sensitivity: 'base' }));
        }

        function getBuilderIngredients() {
            if (menuBuilderDraft) return sortIngredients(menuBuilderDraft.ingredients);
            ensureMenuData();
            return sortIngredients(settings.ingredients);
        }

        function getActiveMenuPlan() {
            if (menuBuilderDraft?.menuPlan) return menuBuilderDraft.menuPlan;
            ensureMenuData();
            return settings.menuPlan;
        }

        function getIngredient(id, ingredients = null) {
            const list = ingredients || getBuilderIngredients();
            return (list || []).find(i => i.id === id) || null;
        }

        function migrateDailyBudget() {
            if (settings.dailyBudgetKcal > 0) return;
            const legacyBudget = settings.dailyBudget?.arbeit || settings.dailyBudget?.frei;
            settings.dailyBudgetKcal = legacyBudget > 0
                ? Math.round(legacyBudget)
                : DEFAULT_DAILY_BUDGET_KCAL;
        }

        function getDailyBudget() {
            ensureMenuData();
            const v = settings.dailyBudgetKcal;
            return v > 0 ? Math.round(v) : DEFAULT_DAILY_BUDGET_KCAL;
        }

        function getPreviewDailyBudget() {
            const el = document.getElementById('settings-daily-budget');
            const v = parseInt(el?.value, 10);
            return v > 0 ? v : getDailyBudget();
        }

        function getBuilderBudget() {
            if (isSettingsOpen()) return getPreviewDailyBudget();
            return getDailyBudget();
        }

        function sumMenuKcal(plan = null, ingredients = null) {
            const menu = plan || getActiveMenuPlan();
            let total = 0;
            MEAL_SLOTS.forEach(slot => {
                (menu[slot] || []).forEach(ingId => {
                    const ing = getIngredient(ingId, ingredients);
                    if (ing) total += ing.kcal || 0;
                });
            });
            return total;
        }

        function sumMenuProtein(plan = null, ingredients = null) {
            const menu = plan || getActiveMenuPlan();
            let total = 0;
            MEAL_SLOTS.forEach(slot => {
                (menu[slot] || []).forEach(ingId => {
                    const ing = getIngredient(ingId, ingredients);
                    if (ing) total += ing.protein || 0;
                });
            });
            return total;
        }

        function escapeHtml(str) {
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;');
        }

        function sortIngredientLabels(items) {
            return [...items].sort((a, b) =>
                a.label.localeCompare(b.label, 'de', { numeric: true, sensitivity: 'base' })
            );
        }

        function renderTodayMeals() {
            ensureMenuData();
            const container = document.getElementById('meals-today');
            if (!container) return;
            const plan = settings.menuPlan || {};
            container.innerHTML = MEAL_SLOTS.map(slot => {
                const ids = plan[slot] || [];
                const items = sortIngredientLabels(
                    ids.map(id => getIngredient(id, settings.ingredients)).filter(Boolean)
                );
                const slotKcal = items.reduce((sum, i) => sum + (i.kcal || 0), 0);
                const slotProtein = items.reduce((sum, i) => sum + (i.protein || 0), 0);
                const ingredientList = items.length
                    ? items.map(i => `<li class="${MEAL_INGREDIENT_COLOR} leading-snug">${escapeHtml(i.label)}</li>`).join('')
                    : '<li class="text-slate-400 dark:text-slate-500 leading-snug">—</li>';
                return `
                    <div class="meal-row flex justify-between items-start py-2.5 px-3 rounded-2xl min-h-0">
                        <div class="min-w-0 flex-1 pr-2">
                            <span class="font-medium text-slate-800 dark:text-slate-100">${slot}</span>
                            <ul class="mt-1.5 space-y-0.5 list-none pl-0 text-xs">${ingredientList}</ul>
                        </div>
                        <div class="text-right font-bold ${MEAL_KCAL_COLOR} shrink-0">
                            <div>${slotKcal} kcal</div>
                            <div class="text-xs font-semibold accent-gold">${slotProtein}g Protein</div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function setActiveMealSlot(slot) {
            activeMealSlot = slot;
            renderMenuBuilder();
        }

        function addIngredientToSlot(slot, ingredientId) {
            if (!menuBuilderDraft) return;
            if (!getIngredient(ingredientId)) return;
            if (!menuBuilderDraft.menuPlan[slot]) {
                menuBuilderDraft.menuPlan[slot] = [];
            }
            menuBuilderDraft.menuPlan[slot].push(ingredientId);
            renderMenuBuilder();
        }

        function removeIngredientFromSlot(slot, index) {
            if (!menuBuilderDraft) return;
            menuBuilderDraft.menuPlan[slot].splice(index, 1);
            renderMenuBuilder();
        }

        function clearIngDragState() {
            dragIngState = { id: null, sourceSlot: null, sourceIndex: null };
            document.querySelectorAll('.meal-drop-active').forEach(el => el.classList.remove('meal-drop-active'));
        }

        function ingDragStart(event, id, sourceSlot, sourceIndex) {
            dragIngState = { id, sourceSlot, sourceIndex };
            event.dataTransfer.effectAllowed = 'move';
        }

        function ingDragEnd() {
            clearIngDragState();
        }

        function ingDragOver(event) {
            event.preventDefault();
            event.currentTarget.classList.add('meal-drop-active');
        }

        function ingDragLeave(event) {
            event.currentTarget.classList.remove('meal-drop-active');
        }

        function ingDropOnSlot(event, slot) {
            event.preventDefault();
            event.stopPropagation();
            event.currentTarget.classList.remove('meal-drop-active');
            const { id, sourceSlot, sourceIndex } = dragIngState;
            if (!id || !menuBuilderDraft) return;

            const plan = menuBuilderDraft.menuPlan;
            if (!plan[slot]) plan[slot] = [];
            const target = plan[slot];

            if (sourceSlot === null) {
                target.push(id);
            } else if (sourceSlot === slot) {
                const [moved] = plan[sourceSlot].splice(sourceIndex, 1);
                target.push(moved);
            } else {
                plan[sourceSlot].splice(sourceIndex, 1);
                target.push(id);
            }

            clearIngDragState();
            renderMenuBuilder();
        }

        function sumSlotKcal(slot) {
            const plan = getActiveMenuPlan();
            return (plan[slot] || []).reduce((sum, ingId) => {
                const ing = getIngredient(ingId);
                return sum + (ing?.kcal || 0);
            }, 0);
        }

        function sumSlotProtein(slot) {
            const plan = getActiveMenuPlan();
            return (plan[slot] || []).reduce((sum, ingId) => {
                const ing = getIngredient(ingId);
                return sum + (ing?.protein || 0);
            }, 0);
        }

        function renderMenuBuilder() {
            if (!menuBuilderDraft) return;
            const ingredients = menuBuilderDraft.ingredients;
            const plan = menuBuilderDraft.menuPlan;
            const used = sumMenuKcal(plan, ingredients);
            const usedProtein = sumMenuProtein(plan, ingredients);
            const budget = getBuilderBudget();
            const remaining = budget - used;

            const remEl = document.getElementById('menu-remaining-kcal');
            const ampelEl = document.getElementById('menu-protein-ampel');
            if (!remEl) return;
            const remClass = remaining < 0 ? 'text-red-600 dark:text-red-400' : (remaining < 100 ? 'accent-gold' : 'text-teal-700 dark:text-teal-400');
            remEl.className = `text-base font-bold ${remClass}`;
            remEl.textContent = remaining >= 0
                ? `Noch ${remaining} kcal · ${used}/${budget} kcal`
                : `${Math.abs(remaining)} kcal drüber · ${used}/${budget} kcal`;

            const proteinTarget = BASE_PROTEIN;
            if (ampelEl) {
                let ampelClass = 'protein-ampel-ok';
                let ampelText = `${usedProtein} / ${proteinTarget}g Protein ✓`;
                if (usedProtein < proteinTarget - 10) {
                    ampelClass = 'protein-ampel-low';
                    ampelText = `${usedProtein} / ${proteinTarget}g Protein — zu wenig`;
                } else if (usedProtein < proteinTarget) {
                    ampelClass = 'protein-ampel-warn';
                    ampelText = `${usedProtein} / ${proteinTarget}g Protein — knapp`;
                }
                ampelEl.className = `text-sm font-semibold mt-0.5 ${ampelClass}`;
                ampelEl.textContent = ampelText;
            }

            document.getElementById('active-meal-label').textContent = activeMealSlot;

            const poolEl = document.getElementById('ingredient-pool');
            poolEl.innerHTML = ingredients.map(ing => `
                <button type="button" draggable="true"
                        class="ingredient-chip w-full flex items-center justify-between gap-2 px-3.5 py-2.5 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-600 hover:border-teal-300 dark:hover:border-teal-600 hover:bg-teal-50 dark:hover:bg-teal-900/40 rounded-xl text-sm font-medium text-slate-700 dark:text-slate-200 shadow-sm text-left"
                        ondragstart="ingDragStart(event, '${ing.id}', null, null)"
                        ondragend="ingDragEnd()"
                        onclick="addIngredientToSlot(activeMealSlot, '${ing.id}')"
                        title="${escapeHtml(ing.label)} · ${ing.kcal} kcal · ${ing.protein || 0}g Protein">
                    <span class="truncate">${escapeHtml(ing.label)}</span>
                    <span class="text-slate-400 shrink-0 text-xs">${ing.kcal} · ${ing.protein || 0}g</span>
                </button>
            `).join('');

            const slotsEl = document.getElementById('meal-slots-container');
            slotsEl.innerHTML = MEAL_SLOTS.map((slot, si) => {
                const ids = plan[slot] || [];
                const slotKcal = sumSlotKcal(slot);
                const slotProtein = sumSlotProtein(slot);
                const isActive = activeMealSlot === slot;
                const border = MEAL_SLOT_COLORS[si];
                const items = ids.map((ingId, ii) => {
                    const ing = getIngredient(ingId);
                    if (!ing) return '';
                    return `
                        <span class="inline-flex items-center gap-1.5 pl-2.5 pr-1.5 py-1.5 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-600 rounded-lg text-sm meal-card text-slate-800 dark:text-slate-200"
                              draggable="true"
                              ondragstart="ingDragStart(event, '${ingId}', '${slot}', ${ii})"
                              ondragend="ingDragEnd()">
                            ${escapeHtml(ing.label)}
                            <span class="text-slate-400">${ing.kcal} · ${ing.protein || 0}g</span>
                            <button type="button" onclick="removeIngredientFromSlot('${slot}', ${ii})"
                                    class="text-slate-300 hover:text-red-500 leading-none ml-0.5">&times;</button>
                        </span>
                    `;
                }).join('');

                return `
                    <div class="rounded-2xl border-2 border-dashed p-3.5 ${border} ${isActive ? 'ring-2 ring-teal-400 ring-offset-1 dark:ring-offset-slate-800' : ''}"
                         ondragover="ingDragOver(event)" ondragleave="ingDragLeave(event)"
                         ondrop="ingDropOnSlot(event, '${slot}')">
                        <button type="button" onclick="setActiveMealSlot('${slot}')"
                                class="w-full flex justify-between items-center mb-2.5 text-left">
                            <span class="font-semibold text-slate-800 dark:text-slate-100 text-base">${slot}</span>
                            <span class="text-sm font-bold text-slate-500 dark:text-slate-400">${slotKcal} kcal · ${slotProtein}g Protein</span>
                        </button>
                        <div class="flex flex-wrap gap-2 h-[8.5rem] overflow-y-auto content-start">
                            ${items || '<span class="text-sm text-slate-400 dark:text-slate-500 py-1">Hierher ziehen…</span>'}
                        </div>
                    </div>
                `;
            }).join('');
        }

        function renderIngredientEditor() {
            if (!ingredientEditorDraft) return;
            document.getElementById('ingredient-editor-list').innerHTML = sortIngredients(ingredientEditorDraft).map(ing => `
                <div class="grid grid-cols-1 sm:grid-cols-[1fr_5.5rem_4.5rem_2rem] gap-2 sm:gap-3 items-center p-3 ui-card rounded-xl">
                    <input type="text" value="${escapeHtml(ing.label)}"
                           oninput="updateIngredientDraft('${ing.id}', 'label', this.value)"
                           placeholder="z.B. Reis (gekocht) 50g"
                           class="ui-input w-full border rounded-xl px-3 py-2.5 text-base min-w-0">
                    <input type="number" min="0" value="${ing.kcal || 0}"
                           oninput="updateIngredientDraft('${ing.id}', 'kcal', parseInt(this.value, 10) || 0)"
                           class="ui-input w-full border rounded-xl px-2 py-2.5 text-base text-right">
                    <input type="number" min="0" value="${ing.protein || 0}"
                           oninput="updateIngredientDraft('${ing.id}', 'protein', parseInt(this.value, 10) || 0)"
                           class="ui-input w-full border rounded-xl px-2 py-2.5 text-base text-right">
                    <button type="button" onclick="removeIngredientDraft('${ing.id}')"
                            class="text-slate-300 hover:text-red-500 text-2xl leading-none justify-self-end">&times;</button>
                </div>
            `).join('');
        }

        function updateIngredientDraft(id, field, value) {
            const ing = ingredientEditorDraft.find(i => i.id === id);
            if (ing) {
                ing[field] = value;
                renderMenuBuilder();
            }
        }

        function addIngredientInSettings() {
            if (!ingredientEditorDraft) return;
            ingredientEditorDraft.push({ id: 'i' + Date.now(), label: 'Neue Zutat', kcal: 0, protein: 0 });
            renderIngredientEditor();
            renderMenuBuilder();
        }

        function removeIngredientDraft(id) {
            if (!ingredientEditorDraft || ingredientEditorDraft.length <= 1) {
                alert('Mindestens eine Zutat behalten.');
                return;
            }
            ingredientEditorDraft = ingredientEditorDraft.filter(i => i.id !== id);
            if (menuBuilderDraft) menuBuilderDraft.ingredients = ingredientEditorDraft;
            renderIngredientEditor();
            renderMenuBuilder();
        }

        function updateUI() {
            const dayNames = ['Sonntag', 'Montag', 'Dienstag', 'Mittwoch', 'Donnerstag', 'Freitag', 'Samstag'];
            document.getElementById('current-day-name').textContent = dayNames[new Date().getDay()];
            document.getElementById('current-day-date').textContent = formatDateDE(getTodayKey());
            renderTodayMeals();
        }

        function isSettingsOpen() {
            const modal = document.getElementById('settings-modal');
            return modal && !modal.classList.contains('hidden');
        }

        function exportData() {
            const payload = localStorage.getItem('ernaehrung_v3');
            if (!payload) {
                alert('Keine Daten zum Exportieren.');
                return;
            }
            const blob = new Blob([payload], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `ernaehrung-backup-${getTodayKey()}.json`;
            a.click();
            URL.revokeObjectURL(url);
        }

        function importDataFromFile(event) {
            const file = event.target.files?.[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (e) => {
                try {
                    const parsed = JSON.parse(e.target.result);
                    if (!parsed.settings) throw new Error('invalid');
                    if (!confirm('Alle aktuellen Daten werden ersetzt. Fortfahren?')) return;
                    localStorage.setItem('ernaehrung_v3', JSON.stringify({ settings: parsed.settings }));
                    location.reload();
                } catch (err) {
                    alert('Ungültige Backup-Datei.');
                }
            };
            reader.readAsText(file);
            event.target.value = '';
        }

        function showSettings() {
            ensureMenuData();
            document.getElementById('settings-daily-budget').value = getDailyBudget();
            menuBuilderDraft = {
                ingredients: JSON.parse(JSON.stringify(settings.ingredients)),
                menuPlan: JSON.parse(JSON.stringify(settings.menuPlan))
            };
            ingredientEditorDraft = menuBuilderDraft.ingredients;
            renderMenuBuilder();
            renderIngredientEditor();
            document.getElementById('settings-modal').classList.remove('hidden');
            document.getElementById('settings-modal').classList.add('flex');
        }

        function hideSettings() {
            menuBuilderDraft = null;
            ingredientEditorDraft = null;
            document.getElementById('settings-modal').classList.remove('flex');
            document.getElementById('settings-modal').classList.add('hidden');
        }

        function remapMealSlotName(plan, oldName, newName) {
            if (!plan || plan[oldName] == null) return;
            if (plan[newName] == null) {
                plan[newName] = plan[oldName];
            }
            delete plan[oldName];
        }

        function remapMenuIngredientIds(plan, idMap) {
            MEAL_SLOTS.forEach(slot => {
                const list = plan?.[slot];
                if (!list) return;
                plan[slot] = list.map(id => idMap[id] || id);
            });
        }

        function pruneMenuPlan(plan, validIds) {
            MEAL_SLOTS.forEach(slot => {
                const list = plan[slot] || [];
                plan[slot] = list.filter(id => validIds.has(id));
            });
        }

        function saveSettings() {
            const budget = parseInt(document.getElementById('settings-daily-budget').value, 10);
            settings.dailyBudgetKcal = budget > 0 ? budget : DEFAULT_DAILY_BUDGET_KCAL;
            cleanupLegacySettings();
            if (menuBuilderDraft) {
                settings.ingredients = JSON.parse(JSON.stringify(menuBuilderDraft.ingredients));
                settings.menuPlan = JSON.parse(JSON.stringify(menuBuilderDraft.menuPlan));
                pruneMenuPlan(settings.menuPlan, new Set(settings.ingredients.map(i => i.id)));
            }
            menuBuilderDraft = null;
            ingredientEditorDraft = null;
            hideSettings();
            updateUI();
            saveData();
        }

        function init() {
            loadData();
            ensureMenuData();
            updateUI();
            saveData();
        }

        window.onload = init;
    </script>
</body>
</html>
